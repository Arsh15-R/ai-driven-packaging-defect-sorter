# YOLOv9 Dataset Configuration for AI-Driven Packaging Line Defect Sorter
# Product: Small Packaging Boxes (Medicine / Cosmetics / Food Cartons)

# Root directory of the dataset (forward slashes are safe on Windows)
path: dataset

# Relative paths from 'path' above
train: images/train
val: images/val
test: images/test

# Number of classes
nc: 5

# Class names mapping (index: label)
names:
  0: good
  1: dent
  2: label_missing
  3: seal_broken
  4: wrong_print
